<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sledilnik Projektnega Časa</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-blur: blur(12px);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --primary: #0071e3;
            --primary-hover: #0077ed;
            --danger: #ff453a;
            --success: #34c759;
            --border: rgba(0, 0, 0, 0.08);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #141416 0%, #28282b 100%);
                --card-bg: rgba(28, 28, 30, 0.8);
                --text-main: #f5f5f7;
                --text-muted: #86868b;
                --primary: #0a84ff;
                --primary-hover: #2291ff;
                --danger: #ff453a;
                --success: #32d74b;
                --border: rgba(255, 255, 255, 0.08);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px env(safe-area-inset-bottom) 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin-top: env(safe-area-inset-top);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(120, 120, 128, 0.08);
            border: 1px solid transparent;
            border-radius: 10px;
            font-size: 16px;
            color: var(--text-main);
            transition: all 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%2386868b' d='M0,0 L5,5 L10,0 Z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 10px 6px;
            padding-right: 30px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(120, 120, 128, 0.02);
        }

        textarea {
            resize: none;
            height: 70px;
        }

        button.btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.btn-submit:active {
            transform: scale(0.99);
            opacity: 0.9;
        }

        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .history-header h2 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .total-badge {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(0, 113, 227, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
