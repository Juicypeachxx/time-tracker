<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sledilnik Časa Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180' width='180' height='180'><rect width='180' height='180' rx='40' fill='%23000000'/><g transform='scale(1.2) translate(15, 15)' stroke='%232563eb' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'><circle cx='50' cy='50' r='38'/><path d='M50 20 A30 30 0 1 1 20 50'/><path d='M88 40 A44 44 0 1 1 50 88'/><line x1='50' y1='50' x2='50' y2='30'/><line x1='50' y1='50' x2='65' y2='35'/><path d='M15 15 L25 25 M85 15 L75 25' stroke-width='5'/><circle cx='80' cy='80' r='14' fill='%23000000' stroke='%232563eb' stroke-width='5'/><path d='M74 80 L78 84 L86 74' stroke='%232563eb' stroke-width='4'/></g></svg>">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g stroke='%23007AFF' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'><circle cx='50' cy='50' r='38'/><path d='M50 20 A30 30 0 1 1 20 50'/><path d='M88 40 A44 44 0 1 1 50 88'/><line x1='50' y1='50' x2='50' y2='30'/><line x1='50' y1='50' x2='65' y2='35'/><circle cx='80' cy='80' r='14' fill='white' stroke='%23007AFF' stroke-width='5'/><path d='M74 80 L78 84 L86 74' stroke='%23007AFF' stroke-width='4'/></g></svg>">

    <style>
        :root {
            /* Svetla tema (Privzeto) */
            --bg-main: #F2F2F7;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --accent: #007AFF;
            --border: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(0, 0, 0, 0.05);
            --card-blur: blur(20px);
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --success: #34C759;
            --danger: #FF3B30;
        }

        [data-theme="dark"] {
            /* Temna tema */
            --bg-main: #000000;
            --bg-card: rgba(28, 28, 30, 0.8);
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --accent: #0A84FF;
            --border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(255, 255, 255, 0.1);
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            width: 100%;
            max-width: 500px;
            padding: 24px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .theme-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background-color: var(--input-bg);
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .theme-switch::after {
            content: '☀️';
            position: absolute;
            left: 4px;
            top: 2px;
            font-size: 16px;
            transition: 0.3s;
        }

        [data-theme="dark"] .theme-switch::after {
            content: '🌙';
            transform: translateX(22px);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 16px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 600;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            margin-left: 4px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 0;
        }

        input, textarea, select {
            width: 100%;
            height: 50px;
            background: var(--input-bg);
            border: none;
            color: var(--text-main);
            padding: 0 14px;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }

        textarea {
            height: auto;
            padding: 14px;
        }

        input[type="date"],
        input[type="time"] {
            display: flex;
            align-items: center;
            line-height: 50px; 
            padding-top: 0;
            padding-bottom: 0;
            min-height: 50px;
        }

        select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238E8E93' d='M0 0l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 12px;
            padding-right: 36px;
        }

        input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        button {
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
            opacity: 0.8;
        }

        button.btn-submit {
            width: 100%;
            background-color: var(--accent);
            color: #FFFFFF;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 14px;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            height: auto;
        }

        button.btn-secondary {
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            height: 50px;
        }

        .total-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .total-display h2 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .total-badge {
            background: var(--accent);
            color: #fff;
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
        }

        .task-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-client {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .task-main-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-right: 50px;
        }

        .task-project {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .task-duration {
            font-weight: 700;
            color: var(--success);
            white-space: nowrap;
        }

        .task-location {
            display: inline-flex;
            align-items: center;
            font-size: 13px;
            background: var(--input-bg);
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .task-meta {
            font-size: 13px;
            color: var(--text-muted);
        }

        .task-notes {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 14px;
            font-style: italic;
            color: var(--text-main);
            opacity: 0.8;
            word-break: break-word;
        }

        .delete-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .filter-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .filter-container select {
            height: 50px;
        }

        .accordion-container {
            width: 100%;
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            box-shadow: var(--shadow);
            margin-top: 25px;
            user-select: none;
        }

        .accordion-icon {
            font-size: 12px;
            color: var(--text-muted);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-top 0.3s ease;
            opacity: 0;
        }

        .accordion-container.active .accordion-icon {
            transform: rotate(90deg);
        }

        .accordion-container.active .accordion-content {
            max-height: 400px;
            margin-top: 12px;
            opacity: 1;
        }

        .client-list-manage {
            margin-top: 12px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .client-manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid rgba(142, 142, 147, 0.1);
            font-size: 15px;
        }

        .client-manage-item button {
            background: none;
            border: none;
            color: var(--danger);
            font-weight: 600;
            font-size: 13px;
            padding: 4px 8px;
            height: auto;
        }
    </style>
</head>
<body data-theme="light">

    <div class="header">
        <h1>Sledilnik Časa</h1>
        <div class="theme-switch" id="themeToggle" onclick="toggleTheme()"></div>
    </div>

    <div class="container">
        
        <div class="card">
            <form id="timeForm">
                <div class="form-group">
                    <label>Stranka</label>
                    <select id="clientNameSelect" required>
                        </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Lokacija</label>
                        <input type="text" id="locationName" placeholder="Lokacija">
                    </div>
                    <div class="form-group">
                        <label>Projekt</label>
                        <input type="text" id="projectName" required placeholder="Projekt">
                    </div>
                </div>

                <div class="form-group">
                    <label>Datum</label>
                    <input type="date" id="taskDate" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Začetek</label>
                        <input type="time" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label>Konec</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Opombe</label>
                    <textarea id="notes" placeholder="Podrobnosti dela..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Zapiši Delovni Čas</button>
            </form>
        </div>

        <div class="filter-container">
            <div class="form-group">
                <label>Filter po stranki</label>
                <select id="clientFilter">
                    <option value="ALL">-- Vse stranke skupaj --</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Filter po mesecu</label>
                <select id="monthFilter">
                    <option value="ALL">-- Vsi meseci --</option>
                </select>
            </div>
        </div>

        <div class="total-display">
            <h2>Zgodovina</h2>
            <div id="totalHours" class="total-badge">0.00 ur</div>
        </div>

        <div id="taskList"></div>

        <div class="accordion-container" id="settingsAccordion">
            <div class="accordion-header" onclick="toggleAccordion()">
                <span>⚙️ Nastavitve in upravljanje strank</span>
                <span class="accordion-icon">▶</span>
            </div>
            
            <div class="accordion-content">
                <div class="card" style="margin-bottom: 0;">
                    <h3>📁 Baza Strank</h3>
                    <div class="form-row" style="margin-bottom: 0;">
                        <div class="form-group" style="margin-bottom: 0; flex: 2;">
                            <input type="text" id="newClientInput" placeholder="Ime nove stranke / podjetja">
                        </div>
                        <button type="button" class="btn-secondary" onclick="addNewClient()">Dodaj</button>
                    </div>
                    
                    <div class="client-list-manage" id="managedClientList"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('taskDate').value = new Date().toISOString().split('T')[0];

        const timeForm = document.getElementById('timeForm');
        const taskListElement = document.getElementById('taskList');
        const totalHoursElement = document.getElementById('totalHours');
        const clientFilter = document.getElementById('clientFilter');
        const monthFilter = document.getElementById('monthFilter');
        const clientNameSelect = document.getElementById('clientNameSelect');
        const managedClientList = document.getElementById('managedClientList');
        const newClientInput = document.getElementById('newClientInput');
        const accordionContainer = document.getElementById('settingsAccordion');

        let tasks = JSON.parse(localStorage.getItem('project_tasks')) || [];
        let clientDatabase = JSON.parse(localStorage.getItem('client_database')) || [];
        let currentClientFilter = 'ALL';
        let currentMonthFilter = 'ALL';

        const monthNamesSlo = [
            "Januar", "Februar", "Marec", "April", "Maj", "Junij",
            "Julij", "Avgust", "September", "Oktober", "November", "December"
        ];

        function toggleAccordion() {
            accordionContainer.classList.toggle('active');
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme_pref', newTheme);
        }
        const savedTheme = localStorage.getItem('theme_pref') || 'light';
        document.body.setAttribute('data-theme', savedTheme);

        function addNewClient() {
            const clientName = newClientInput.value.trim();
            if (!clientName) return;
            if (clientDatabase.includes(clientName)) {
                alert('Ta stranka je že v bazi.');
                return;
            }
            clientDatabase.push(clientName);
            clientDatabase.sort();
            localStorage.setItem('client_database', JSON.stringify(clientDatabase));
            newClientInput.value = '';
            updateFiltersAndLists();
            render();
        }

        window.removeClientFromDb = function(clientName) {
            if (confirm(`Ali res želiš izbrisati stranko "${clientName}" iz baze? (Vpisi ur ostanejo nedotaknjeni)`)) {
                clientDatabase = clientDatabase.filter(c => c !== clientName);
                localStorage.setItem('client_database', JSON.stringify(clientDatabase));
                updateFiltersAndLists();
                render();
            }
        }

        function calculateDuration(start, end) {
            const [sH, sM] = start.split(':').map(Number);
            const [eH, eM] = end.split(':').map(Number);
            let sTotal = sH * 60 + sM;
            let eTotal = eH * 60 + eM;
            if (eTotal < sTotal) eTotal += 24 * 60;
            return (eTotal - sTotal) / 60;
        }

        function formatDateSlo(dateStr) {
            if(!dateStr) return '';
            const parts = dateStr.split('-');
            if(parts.length !== 3) return dateStr;
            const [y, m, d] = parts;
            return `${parseInt(d, 10)}. ${parseInt(m, 10)}. ${y}`;
        }

        function getAvailableMonths(filteredTasks) {
            const months = filteredTasks.map(t => {
                if(!t.taskDate) return null;
                const parts = t.taskDate.split('-');
                return parts.length >= 2 ? `${parts[0]}-${parts[1]}` : null;
            }).filter(Boolean);
            return [...new Set(months)].sort().reverse();
        }

        function updateFiltersAndLists() {
            const activeTaskClients = tasks.map(t => t.clientName);
            const allUniqueClients = [...new Set([...clientDatabase, ...activeTaskClients])].filter(Boolean).sort();
            
            const prevSelectedInputClient = clientNameSelect.value;
            clientNameSelect.innerHTML = '';
            
            if (clientDatabase.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.innerText = "⚠️ Najprej dodaj stranko spodaj";
                opt.disabled = true;
                opt.selected = true;
                clientNameSelect.appendChild(opt);
            } else {
                clientDatabase.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.innerText = c;
                    clientNameSelect.appendChild(opt);
                });
                if (clientDatabase.includes(prevSelectedInputClient)) {
                    clientNameSelect.value = prevSelectedInputClient;
                }
            }
            
            const prevSelectedFilterClient = clientFilter.value;
            clientFilter.innerHTML = '<option value="ALL">-- Vse stranke skupaj --</option>';
            
            allUniqueClients.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.innerText = c;
                clientFilter.appendChild(opt);
            });
            
            if (allUniqueClients.includes(prevSelectedFilterClient)) {
                clientFilter.value = prevSelectedFilterClient;
                currentClientFilter = prevSelectedFilterClient;
            } else {
                clientFilter.value = 'ALL';
                currentClientFilter = 'ALL';
            }

            const tasksForMonths = tasks.filter(t => currentClientFilter === 'ALL' || t.clientName === currentClientFilter);
            const availableMonths = getAvailableMonths(tasksForMonths);
            
            const prevSelectedMonth = monthFilter.value;
            monthFilter.innerHTML = '<option value="ALL">-- Vsi meseci --</option>';
            
            availableMonths.forEach(mKey => {
                const parts = mKey.split('-');
                if(parts.length === 2) {
                    const [year, monthNum] = parts;
                    const monthName = monthNamesSlo[parseInt(monthNum, 10) - 1];
                    const opt = document.createElement('option');
                    opt.value = mKey;
                    opt.innerText = `${monthName} ${year}`;
                    monthFilter.appendChild(opt);
                }
            });

            if (availableMonths.includes(prevSelectedMonth)) {
                monthFilter.value = prevSelectedMonth;
                currentMonthFilter = prevSelectedMonth;
            } else {
                monthFilter.value = 'ALL';
                currentMonthFilter = 'ALL';
            }

            managedClientList.innerHTML = '';
            if (clientDatabase.length === 0) {
                managedClientList.innerHTML = '<p style="text-align:center; font-size:14px; opacity:0.5; margin: 10px 0;">Baza strank je prazna.</p>';
            } else {
                clientDatabase.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'client-manage-item';
                    div.innerHTML = `<span>${escape(c)}</span><button onclick="removeClientFromDb('${c.replace(/'/g, "\\'")}')">Odstrani</button>`;
                    managedClientList.appendChild(div);
                });
            }
        }

        function render() {
            taskListElement.innerHTML = '';
            let total = 0;

            const filtered = tasks.filter(t => {
                const matchClient = (currentClientFilter === 'ALL' || t.clientName === currentClientFilter);
                let matchMonth = true;
                if (currentMonthFilter !== 'ALL' && t.taskDate) {
                    const parts = t.taskDate.split('-');
                    if(parts.length >= 2) {
                        matchMonth = (`${parts[0]}-${parts[1]}` === currentMonthFilter);
                    }
                }
                return matchClient && matchMonth;
            });

            if (filtered.length === 0) {
                taskListElement.innerHTML = '<p style="text-align:center; opacity:0.5; margin: 20px 0;">Ni vnosov za izbrane filtre.</p>';
                totalHoursElement.innerText = '0.00 ur';
                return;
            }

            filtered.sort((a, b) => new Date(b.taskDate) - new Date(a.taskDate)).forEach(t => {
                const dur = calculateDuration(t.startTime, t.endTime);
                total += dur;

                const originalIndex = tasks.indexOf(t);
                const item = document.createElement('div');
                item.className = 'task-item';
                item.innerHTML = `
                    <div class="task-client">${escape(t.clientName)}</div>
                    <div class="task-main-info">
                        <div class="task-project">${escape(t.projectName)}</div>
                        <div class="task-duration">${dur.toFixed(2)} ur</div>
                    </div>
                    ${t.locationName ? `<div class="task-location">📍 ${escape(t.locationName)}</div>` : ''}
                    <div class="task-meta">${formatDateSlo(t.taskDate)} • ${t.startTime} - ${t.endTime}</div>
                    ${t.notes ? `<div class="task-notes">${escape(t.notes)}</div>` : ''}
                    <button class="delete-btn" onclick="deleteTask(${originalIndex})">Briši</button>
                `;
                taskListElement.appendChild(item);
            });

            totalHoursElement.innerText = `${total.toFixed(2)} ur`;
        }

        function escape(s) {
            let d = document.createElement('div');
            d.innerText = s;
            return d.innerHTML;
        }

        timeForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newTask = {
                clientName: clientNameSelect.value,
                locationName: document.getElementById('locationName').value.trim(),
                projectName: document.getElementById('projectName').value.trim(),
                taskDate: document.getElementById('taskDate').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                notes: document.getElementById('notes').value.trim()
            };

            tasks.push(newTask);
            localStorage.setItem('project_tasks', JSON.stringify(tasks));
            
            timeForm.reset();
            document.getElementById('taskDate').value = new Date().toISOString().split('T')[0];
            
            updateFiltersAndLists();
            render();
        });

        clientFilter.addEventListener('change', (e) => {
            currentClientFilter = e.target.value;
            updateFiltersAndLists();
            monthFilter.value = 'ALL';
            currentMonthFilter = 'ALL';
            render();
        });

        monthFilter.addEventListener('change', (e) => {
            currentMonthFilter = e.target.value;
            render();
        });

        window.deleteTask = function(i) {
            if (confirm('Izbrišem ta vnos časa?')) {
                tasks.splice(i, 1);
                localStorage.setItem('project_tasks', JSON.stringify(tasks));
                updateFiltersAndLists();
                render();
            }
        };

        updateFiltersAndLists();
        render();
    </script>
</body>
</html>
