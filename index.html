<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sledilnik Projektnega Časa</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-blur: blur(12px);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --primary: #0071e3;
            --primary-hover: #0077ed;
            --danger: #ff453a;
            --success: #34c759;
            --border: rgba(0, 0, 0, 0.08);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #141416 0%, #28282b 100%);
                --card-bg: rgba(28, 28, 30, 0.8);
                --text-main: #f5f5f7;
                --text-muted: #86868b;
                --primary: #0a84ff;
                --primary-hover: #2291ff;
                --danger: #ff453a;
                --success: #32d74b;
                --border: rgba(255, 255, 255, 0.08);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px env(safe-area-inset-bottom) 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin-top: env(safe-area-inset-top);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(120, 120, 128, 0.08);
            border: 1px solid transparent;
            border-radius: 10px;
            font-size: 16px; /* Prevents auto-zoom on iOS */
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(120, 120, 128, 0.02);
        }

        textarea {
            resize: none;
            height: 70px;
        }

        button.btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.btn-submit:active {
            transform: scale(0.99);
            opacity: 0.9;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .history-header h2 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .total-badge {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(0, 113, 227, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            background: rgba(120, 120, 128, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-right: 60px;
        }

        .project-name {
            font-weight: 600;
            font-size: 16px;
            word-break: break-word;
        }

        .duration {
            font-size: 14px;
            font-weight: 600;
            color: var(--success);
            white-space: nowrap;
        }

        .task-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin: 4px 0 8px 0;
        }

        .task-notes {
            font-size: 14px;
            background: rgba(120, 120, 128, 0.06);
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text-main);
            word-break: break-word;
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 69, 58, 0.1);
            color: var(--danger);
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .delete-btn:leading {
            background: rgba(255, 69, 58, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sledilnik Časa</h1>

    <div class="card">
        <form id="timeForm">
            <div class="form-group">
                <label for="projectName">Ime Projekta</label>
                <input type="text" id="projectName" required placeholder="npr. Spletna stran za stranko">
            </div>
            <div class="form-group">
                <label for="taskDate">Datum</label>
                <input type="date" id="taskDate" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="startTime">Začetek</label>
                    <input type="time" id="startTime" required>
                </div>
                <div class="form-group">
                    <label for="endTime">Konec</label>
                    <input type="time" id="endTime" required>
                </div>
            </div>
            <div class="form-group">
                <label for="notes">Opombe</label>
                <textarea id="notes" placeholder="Dodatne podrobnosti o delu..."></textarea>
            </div>
            <button type="submit" class="btn-submit">Zapiši Delovni Čas</button>
        </form>
    </div>

    <div class="card">
        <div class="history-header">
            <h2>Zgodovina</h2>
            <div id="totalHours" class="total-badge">Skupaj: 0.00 ur</div>
        </div>
        <div id="taskList" class="task-list"></div>
    </div>
</div>

<script>
    // Set current date manually inside client context
    document.getElementById('taskDate').value = new Date().toISOString().split('T')[0];

    const timeForm = document.getElementById('timeForm');
    const taskListElement = document.getElementById('taskList');
    const totalHoursElement = document.getElementById('totalHours');

    let tasks = JSON.parse(localStorage.getItem('project_tasks')) || [];

    function calculateDuration(start, end) {
        const [startHours, startMins] = start.split(':').map(Number);
        const [endHours, endMins] = end.split(':').map(Number);
        
        let startTotalMinutes = (startHours * 60) + startMins;
        let endTotalMinutes = (endHours * 60) + endMins;

        if (endTotalMinutes < startTotalMinutes) {
            endTotalMinutes += 24 * 60; // Next-day rollover adjustment
        }

        return (endTotalMinutes - startTotalMinutes) / 60;
    }

    function formatDateSlovenian(dateStr) {
        if(!dateStr) return '';
        const parts = dateStr.split('-');
        if(parts.length !== 3) return dateStr;
        return `${parts[2]}. ${parts[1]}. ${parts[0]}`;
    }

    function updateUI() {
        taskListElement.innerHTML = '';
        let globalTotalHours = 0;

        if (tasks.length === 0) {
            taskListElement.innerHTML = '<p style="text-align:center; color: var(--text-muted); font-size: 14px; margin: 20px 0;">Ni zabeleženih projektov.</p>';
            totalHoursElement.innerText = 'Skupaj: 0.00 ur';
            return;
        }

        tasks.forEach((task, index) => {
            const hours = calculateDuration(task.startTime, task.endTime);
            globalTotalHours += hours;

            const item = document.createElement('div');
            item.className = 'task-item';
            item.innerHTML = `
                <div class="task-title-row">
                    <span class="project-name">${escapeHtml(task.projectName)}</span>
                    <span class="duration">${hours.toFixed(2)} ur</span>
                </div>
                <div class="task-meta">
                    ${formatDateSlovenian(task.taskDate)} • ${task.startTime} do ${task.endTime}
                </div>
                ${task.notes ? `<div class="task-notes">${escapeHtml(task.notes)}</div>` : ''}
                <button class="delete-btn" onclick="deleteTask(${index})">Briši</button>
            `;
            taskListElement.appendChild(item);
        });

        totalHoursElement.innerText = `Skupaj: ${globalTotalHours.toFixed(2)} ur`;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    timeForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const newTask = {
            projectName: document.getElementById('projectName').value,
            taskDate: document.getElementById('taskDate').value,
            startTime: document.getElementById('startTime').value,
            endTime: document.getElementById('endTime').value,
            notes: document.getElementById('notes').value
        };

        tasks.push(newTask);
        localStorage.setItem('project_tasks', JSON.stringify(tasks));
        
        document.getElementById('projectName').value = '';
        document.getElementById('notes').value = '';
        
        updateUI();
    });

    window.deleteTask = function(index) {
        if(confirm('Ali ste prepričani, da želite izbrisati ta vnos?')) {
            tasks.splice(index, 1);
            localStorage.setItem('project_tasks
