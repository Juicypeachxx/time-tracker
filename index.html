<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sledilnik Časa Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        :root {
            /* Svetla tema (Privzeto) */
            --bg-main: #F2F2F7;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --accent: #007AFF;
            --border: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(0, 0, 0, 0.05);
            --card-blur: blur(20px);
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --success: #34C759;
            --danger: #FF3B30;
        }

        [data-theme="dark"] {
            /* Temna tema */
            --bg-main: #000000;
            --bg-card: rgba(28, 28, 30, 0.8);
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --accent: #0A84FF;
            --border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(255, 255, 255, 0.1);
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            /* Safe area for iOS */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            width: 100%;
            max-width: 500px;
            padding: 24px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* Dark Mode Toggle Switch */
        .theme-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background-color: var(--input-bg);
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .theme-switch::after {
            content: '☀️';
            position: absolute;
            left: 4px;
            top: 2px;
            font-size: 16px;
            transition: 0.3s;
        }

        [data-theme="dark"] .theme-switch::after {
            content: '🌙';
            transform: translateX(22px);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 16px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            margin-left: 4px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        input, textarea, select {
            width: 100%;
            background: var(--input-bg);
            border: none;
            color: var(--text-main);
            padding: 14px;
            border-radius: 12px;
            font-size: 16px; /* Prevents iOS zoom */
            outline: none;
        }

        input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        button.btn-submit {
            width: 100%;
            background-color: var(--accent);
            color: #FFFFFF;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 14px;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        button.btn-submit:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .total-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .total-display h2 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .total-badge {
            background: var(--accent);
            color: #fff;
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
        }

        /* Task List Items */
        .task-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-client {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .task-main-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .task-project {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .task-duration {
            font-weight: 700;
            color: var(--success);
        }

        .task-location {
            display: inline-flex;
            align-items: center;
            font-size: 13px;
            background: var(--input-bg);
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .task-meta {
            font-size: 13px;
            color: var(--text-muted);
        }

        .task-notes {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 14px;
            font-style: italic;
            color: var(--text-main);
            opacity: 0.8;
        }

        .delete-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Custom Selector */
        .client-select-wrapper {
            margin-bottom: 24px;
        }

        select#clientFilter {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px;
            font-weight: 600;
        }

    </style>
</head>
<body data-theme="light">

    <div class="header">
        <h1>Sledilnik Časa</h1>
        <div class="theme-switch" id="themeToggle" onclick="toggleTheme()"></div>
    </div>

    <div class="container">
        
        <div class="card">
            <form id="timeForm">
                <div class="form-group">
                    <label>Stranka</label>
                    <input type="text" id="clientName" list="existingClients" required placeholder="Ime podjetja ali stranke">
                    <datalist id="existingClients"></datalist>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Lokacija</label>
                        <input type="text" id="locationName" placeholder="Lokacija">
                    </div>
                    <div class="form-group">
                        <label>Projekt</label>
                        <input type="text" id="projectName" required placeholder="Projekt">
                    </div>
                </div>

                <div class="form-group">
                    <label>Datum</label>
                    <input type="date" id="taskDate" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Začetek</label>
                        <input type="time" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label>Konec</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Opombe</label>
                    <textarea id="notes" placeholder="Podrobnosti dela..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Zapiši Delovni Čas</button>
            </form>
        </div>

        <div class="client-select-wrapper">
            <label>Filter po stranki</label>
            <select id="clientFilter">
                <option value="ALL">-- Vse stranke skupaj --</option>
            </select>
        </div>

        <div class="total-display">
            <h2>Zgodovina</h2>
            <div id="totalHours" class="total-badge">0.00 ur</div>
        </div>

        <div id="taskList"></div>

    </div>

    <script>
        // Nastavitev današnjega datuma
        document.getElementById('taskDate').value = new Date().toISOString().split('T')[0];

        const timeForm = document.getElementById('timeForm');
        const taskListElement = document.getElementById('taskList');
        const totalHoursElement = document.getElementById('totalHours');
        const clientFilter = document.getElementById('clientFilter');
        const existingClientsDatalist = document.getElementById('existingClients');

        let tasks = JSON.parse(localStorage.getItem('project_tasks')) || [];
        let currentFilter = 'ALL';

        // --- THEME LOGIC ---
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme_pref', newTheme);
        }

        // Nalaganje nastavitev teme
        const savedTheme = localStorage.getItem('theme_pref') || 'light';
        document.body.setAttribute('data-theme', savedTheme);

        // --- CORE LOGIC ---
        function calculateDuration(start, end) {
            const [sH, sM] = start.split(':').map(Number);
            const [eH, eM] = end.split(':').map(Number);
            let sTotal = sH * 60 + sM;
            let eTotal = eH * 60 + eM;
            if (eTotal < sTotal) eTotal += 24 * 60;
            return (eTotal - sTotal) / 60;
        }

        function formatDateSlo(dateStr) {
            const [y, m, d] = dateStr.split('-');
            return `${d}. ${m}. ${y}`;
        }

        function updateFilters() {
            const clients = [...new Set(tasks.map(t => t.clientName))].sort();
            const current = clientFilter.value;
            
            clientFilter.innerHTML = '<option value="ALL">-- Vse stranke skupaj --</option>';
            existingClientsDatalist.innerHTML = '';
            
            clients.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.innerText = c;
                clientFilter.appendChild(opt);
                
                const dListOpt = document.createElement('option');
                dListOpt.value = c;
                existingClientsDatalist.appendChild(dListOpt);
            });
            clientFilter.value = current;
        }

        function render() {
            taskListElement.innerHTML = '';
            let total = 0;

            const filtered = tasks.filter(t => currentFilter === 'ALL' || t.clientName === currentFilter);

            if (filtered.length === 0) {
                taskListElement.innerHTML = '<p style="text-align:center; opacity:0.5;">Ni vnosov.</p>';
                totalHoursElement.innerText = '0.00 ur';
                return;
            }

            filtered.sort((a, b) => new Date(b.taskDate) - new Date(a.taskDate)).forEach(t => {
                const dur = calculateDuration(t.startTime, t.endTime);
                total += dur;

                const originalIndex = tasks.indexOf(t);
                const item = document.createElement('div');
                item.className = 'task-item';
                item.innerHTML = `
                    <div class="task-client">${escape(t.clientName)}</div>
                    <div class="task-main-info">
                        <div class="task-project">${escape(t.projectName)}</div>
                        <div class="task-duration">${dur.toFixed(2)} ur</div>
                    </div>
                    ${t.locationName ? `<div class="task-location">📍 ${escape(t.locationName)}</div>` : ''}
                    <div class="task-meta">${formatDateSlo(t.taskDate)} • ${t.startTime} - ${t.endTime}</div>
                    ${t.notes ? `<div class="task-notes">${escape(t.notes)}</div>` : ''}
                    <button class="delete-btn" onclick="deleteTask(${originalIndex})">Briši</button>
                `;
                taskListElement.appendChild(item);
            });

            totalHoursElement.innerText = `${total.toFixed(2)} ur`;
        }

        function escape(s) {
            let d = document.createElement('div');
            d.innerText = s;
            return d.innerHTML;
        }

        timeForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newTask = {
                clientName: document.getElementById('clientName').value.trim(),
                locationName: document.getElementById('locationName').value.trim(),
                projectName: document.getElementById('projectName').value.trim(),
                taskDate: document.getElementById('taskDate').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                notes: document.getElementById('notes').value.trim()
            };
            tasks.push(newTask);
            localStorage.setItem('project_tasks', JSON.stringify(tasks));
            timeForm.reset();
            document.getElementById('taskDate').value = new Date().toISOString().split('T')[0];
            updateFilters();
            render();
        });

        clientFilter.addEventListener('change', (e) => {
            currentFilter = e.target.value;
            render();
        });

        window.deleteTask = function(i) {
            if (confirm('Izbrišem ta vnos?')) {
                tasks.splice(i, 1);
                localStorage.setItem('project_tasks', JSON.stringify(tasks));
                updateFilters();
                render();
            }
        };

        updateFilters();
        render();
    </script>
</body>
</html>
