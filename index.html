<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sledilnik Časa</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sledilnik Časa">

<style>
:root {
/* Svetla tema */
--bg-main: #F2F2F7;
--bg-card: rgba(255, 255, 255, 0.82);
--text-main: #1C1C1E;
--text-muted: #8E8E93;
--accent: #007AFF;
--border: rgba(0, 0, 0, 0.08);
--input-bg: rgba(0, 0, 0, 0.04);
--card-blur: blur(20px);
--shadow: 0 4px 24px rgba(0,0,0,0.06);
--success: #34C759;
--danger: #FF3B30;
--warning: #FF9500;
}

[data-theme="dark"] {
/* Temna tema */
--bg-main: #000000;
--bg-card: rgba(28, 28, 30, 0.8);
--text-main: #FFFFFF;
--text-muted: #8E8E93;
--accent: #0A84FF;
--border: rgba(255, 255, 255, 0.1);
--input-bg: rgba(255, 255, 255, 0.08);
--shadow: 0 4px 24px rgba(0,0,0,0.4);
}

* {
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
transition: background-color 0.3s ease, color 0.3s ease;
}

body {
background-color: var(--bg-main);
color: var(--text-main);
margin: 0;
padding: 0;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
padding-top: env(safe-area-inset-top);
padding-bottom: env(safe-area-inset-bottom);
}

.header {
width: 100%;
max-width: 500px;
padding: 24px 20px 10px;
display: flex;
justify-content: space-between;
align-items: center;
}

.header h1 {
font-size: 24px;
font-weight: 700;
margin: 0;
letter-spacing: -0.5px;
}

.theme-switch {
position: relative;
width: 50px;
height: 28px;
background-color: var(--input-bg);
border-radius: 20px;
cursor: pointer;
border: 1px solid var(--border);
}

.theme-switch::after {
content: '☀️';
position: absolute;
left: 4px;
top: 2px;
font-size: 16px;
transition: 0.3s;
}

[data-theme="dark"] .theme-switch::after {
content: '🌙';
transform: translateX(22px);
}

.container {
width: 100%;
max-width: 500px;
padding: 16px;
display: flex;
flex-direction: column;
gap: 0;
}

.left-column, .right-column {
width: 100%;
display: flex;
flex-direction: column;
}

.card {
background: var(--bg-card);
backdrop-filter: var(--card-blur);
-webkit-backdrop-filter: var(--card-blur);
border: 1px solid var(--border);
border-radius: 20px;
padding: 20px;
box-shadow: var(--shadow);
margin-bottom: 20px;
}

.card h3 {
margin-top: 0;
margin-bottom: 16px;
font-size: 18px;
font-weight: 600;
}

label {
display: block;
font-size: 13px;
font-weight: 600;
color: var(--text-muted);
margin-bottom: 6px;
margin-left: 4px;
text-transform: uppercase;
}

.form-group {
margin-bottom: 16px;
}

.form-row {
display: flex;
gap: 12px;
}

.form-row .form-group {
flex: 1;
min-width: 0;
}

/* POPRAVLJENO: Vnos za čas 24h */
.time-picker-wrapper {
display: flex;
align-items: center;
gap: 4px;
background: var(--input-bg);
border-radius: 12px;
padding: 0 8px;
height: 50px;
flex: 1;
}

.time-picker-wrapper input {
background: transparent;
text-align: center;
padding: 0;
height: 100%;
font-size: 16px;
border: none;
}

.time-separator {
font-weight: bold;
color: var(--text-main);
user-select: none;
}

.time-input-container {
display: flex;
gap: 6px;
width: 100%;
}

input, textarea, select {
width: 100%;
height: 50px;
background: var(--input-bg);
border: none;
color: var(--text-main);
padding: 0 14px;
border-radius: 12px;
font-size: 16px;
outline: none;
appearance: none;
-webkit-appearance: none;
}

textarea {
height: auto;
padding: 14px;
}

input[type="date"] {
display: flex;
align-items: center;
line-height: 50px; 
padding-top: 0;
padding-bottom: 0;
min-height: 50px;
}

select {
background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238E8E93' d='M0 0l5 5 5-5z'/></svg>");
background-repeat: no-repeat;
background-position: right 14px center;
background-size: 12px;
padding-right: 36px;
}

input::placeholder {
color: var(--text-muted);
opacity: 0.6;
}

button {
cursor: pointer;
transition: opacity 0.2s, transform 0.1s;
}

button:active {
transform: scale(0.98);
opacity: 0.8;
}

button.btn-now {
background-color: var(--input-bg);
border: 1px solid var(--border);
color: var(--accent);
font-size: 13px;
font-weight: 600;
padding: 0 12px;
border-radius: 12px;
height: 50px;
white-space: nowrap;
}

button.btn-submit {
width: 100%;
background-color: var(--accent);
color: #FFFFFF;
border: none;
padding: 16px;
font-size: 17px;
font-weight: 600;
border-radius: 14px;
margin-top: 10px;
box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
height: auto;
}

button.btn-submit.mode-edit {
background-color: var(--warning);
box-shadow: 0 4px 12px rgba(255, 149, 0, 0.3);
}

button.btn-secondary {
background-color: var(--input-bg);
color: var(--text-main);
border: 1px solid var(--border);
padding: 12px 16px;
font-size: 15px;
font-weight: 600;
border-radius: 10px;
height: 50px;
}

button.btn-cancel-edit {
width: 100%;
background-color: transparent;
color: var(--danger);
border: 1px solid var(--danger);
padding: 12px;
font-size: 15px;
font-weight: 600;
border-radius: 14px;
margin-top: 8px;
}

button.btn-export {
background-color: var(--success);
color: #FFFFFF;
border: none;
padding: 0 16px;
font-size: 14px;
font-weight: 600;
border-radius: 12px;
height: 38px;
line-height: 38px;
box-shadow: 0 2px 8px rgba(52, 199, 89, 0.2);
white-space: nowrap;
flex-shrink: 0;
display: inline-flex;
align-items: center;
justify-content: center;
-webkit-appearance: none;
}

.total-display {
display: flex;
flex-direction: column;
align-items: flex-start;
margin-bottom: 16px;
padding: 0 4px;
gap: 12px;
}

.total-display h2 {
font-size: 22px;
font-weight: 700;
margin: 0;
letter-spacing: -0.5px;
}

.total-display-buttons-row {
display: flex;
align-items: center;
justify-content: space-between;
width: 100%;
gap: 12px;
}

.total-badge {
background: var(--accent);
color: #fff;
padding: 0 16px;
border-radius: 12px;
font-weight: 700;
font-size: 14px;
height: 38px;
line-height: 38px;
white-space: nowrap;
display: inline-flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}

.task-item {
background: var(--bg-card);
border: 1px solid var(--border);
border-radius: 16px;
padding: 16px;
margin-bottom: 12px;
position: relative;
animation: slideUp 0.4s ease-out;
}

.task-item.editing-now {
border: 2px solid var(--warning);
box-shadow: 0 0 12px rgba(255, 149, 0, 0.2);
}

@keyframes slideUp {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}

.task-client {
font-size: 12px;
font-weight: 700;
color: var(--accent);
text-transform: uppercase;
margin-bottom: 2px;
}

/* POPRAVLJENO: Spremenjena struktura flexboxa, ki zanesljivo preprečuje vsakršno prekrivanje besedila z gumbi */
.task-main-info {
display: flex;
justify-content: space-between;
align-items: flex-start;
gap: 12px;
}

.task-project {
font-size: 17px;
font-weight: 600;
margin-bottom: 6px;
word-break: break-word;
flex: 1;
}

/* POPRAVLJENO: Desna stran s trajanjem in kontrolami dela sinhrono brez prekrivanja */
.task-right-side {
display: flex;
flex-direction: column;
align-items: flex-end;
gap: 8px;
flex-shrink: 0;
}

.task-duration {
font-weight: 700;
color: var(--success);
white-space: nowrap;
background-color: rgba(52, 199, 89, 0.12);
padding: 4px 8px;
border-radius: 6px;
display: inline-block;
font-size: 14px;
}

.task-location {
display: inline-flex;
align-items: center;
font-size: 13px;
background: var(--input-bg);
padding: 4px 8px;
border-radius: 6px;
margin-bottom: 8px;
}

.task-meta {
font-size: 13px;
color: var(--text-muted);
display: flex;
align-items: center;
gap: 6px;
flex-wrap: wrap;
margin-top: 2px;
}

.task-notes {
margin-top: 10px;
padding-top: 10px;
border-top: 1px solid var(--border);
font-size: 14px;
font-style: italic;
color: var(--text-main);
opacity: 0.8;
word-break: break-word;
}

/* POPRAVLJENO: Gumbi niso več absolutno pozicionirani na kartici, ampak so del desnega stebra, s čimer se ne morejo prekrivati */
.task-actions {
display: flex;
gap: 6px;
z-index: 5;
}

.action-btn {
border: none;
padding: 4px 10px;
border-radius: 8px;
font-size: 12px;
font-weight: 600;
display: inline-flex;
align-items: center;
justify-content: center;
height: 28px;
}

.action-btn.edit-btn {
background: var(--input-bg);
color: var(--text-main);
border: 1px solid var(--border);
}

.action-btn.delete-btn {
background: var(--danger);
color: white;
}

.filter-container {
background: var(--bg-card);
border: 1px solid var(--border);
border-radius: 16px;
padding: 14px;
margin-bottom: 24px;
box-shadow: var(--shadow);
}

.filter-container select {
height: 50px;
}

.accordion-container {
width: 100%;
}

.accordion-header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 14px 16px;
background: var(--bg-card);
border: 1px solid var(--border);
border-radius: 14px;
cursor: pointer;
font-weight: 600;
font-size: 15px;
box-shadow: var(--shadow);
margin-top: 10px;
user-select: none;
}

.accordion-icon {
font-size: 12px;
color: var(--text-muted);
transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.accordion-content {
max-height: 0;
overflow: hidden;
transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-top 0.3s ease;
opacity: 0;
}

.accordion-container.active .accordion-icon {
transform: rotate(90deg);
}

.accordion-container.active .accordion-content {
max-height: 400px;
margin-top: 12px;
opacity: 1;
}

.client-list-manage {
margin-top: 12px;
max-height: 150px;
overflow-y: auto;
border-top: 1px solid var(--border);
padding-top: 10px;
}

.client-manage-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 8px 4px;
border-bottom: 1px solid rgba(142, 142, 147, 0.1);
font-size: 15px;
}

.client-manage-item button {
background: none;
border: none;
color: var(--danger);
font-weight: 600;
font-size: 13px;
padding: 4px 8px;
height: auto;
}

@media screen and (min-width: 768px) {
.header {
max-width: 1024px;
padding: 40px 24px 20px 24px;
}

.header h1 {
font-size: 32px;
}

.container {
max-width: 1024px;
padding: 0 24px;
display: grid;
grid-template-columns: 440px 1fr;
gap: 28px;
align-items: start;
}

.left-column {
position: sticky;
top: env(safe-area-inset-top);
}

.filter-container {
margin-bottom: 20px;
display: flex;
gap: 16px;
}

.filter-container .form-group {
flex: 1;
margin-bottom: 0 !important;
}

.total-display {
flex-direction: row;
justify-content: space-between;
align-items: center;
gap: 16px;
}

.total-display h2 {
font-size: 24px;
}

.total-display-buttons-row {
width: auto;
justify-content: flex-end;
gap: 12px;
}

.total-badge, button.btn-export {
height: 42px;
line-height: 42px;
font-size: 15px;
}
}
</style>
</head>
<body data-theme="light">

<div class="header">
<h1>Sledilnik Časa</h1>
<div class="theme-switch" id="themeToggle" onclick="toggleTheme()"></div>
</div>

<div class="container">

<div class="left-column">
<div class="card" id="formCard">
<form id="timeForm">
<div class="form-group">
<label>Stranka</label>
<input type="text" id="clientNameInput" list="clientDatalist" required placeholder="Izberi iz seznama ali vpiši novo...">
<datalist id="clientDatalist"></datalist>
</div>

<div class="form-row">
<div class="form-group">
<label>Lokacija</label>
<input type="text" id="locationName" placeholder="Lokacija">
</div>
<div class="form-group">
<label>Projekt</label>
<input type="text" id="projectName" required placeholder="Projekt">
</div>
</div>

<div class="form-group">
<label>Datum</label>
<input type="date" id="taskDate" required>
</div>

<div class="form-row">
<div class="form-group">
<label>Začetek</label>
<div class="time-input-container">
<div class="time-picker-wrapper">
<input type="text" id="startHour" list="hours24" placeholder="00" required maxlength="2" inputmode="numeric">
<span class="time-separator">:</span>
<input type="text" id="startMin" list="minutes15" placeholder="00" required maxlength="2" inputmode="numeric">
</div>
<button type="button" class="btn-now" onclick="setCurrentTimeCustom('startHour', 'startMin')">Zdaj</button>
</div>
</div>
<div class="form-group">
<label>Konec</label>
<div class="time-input-container">
<div class="time-picker-wrapper">
<input type="text" id="endHour" list="hours24" placeholder="00" required maxlength="2" inputmode="numeric">
<span class="time-separator">:</span>
<input type="text" id="endMin" list="minutes15" placeholder="00" required maxlength="2" inputmode="numeric">
</div>
<button type="button" class="btn-now" onclick="setCurrentTimeCustom('endHour', 'endMin')">Zdaj</button>
</div>
</div>
</div>

<datalist id="hours24">
<option value="00"><option value="01"><option value="02"><option value="03"><option value="04">
<option value="05"><option value="06"><option value="07"><option value="08"><option value="09">
<option value="10"><option value="11"><option value="12"><option value="13"><option value="14">
<option value="15"><option value="16"><option value="17"><option value="18"><option value="19">
<option value="20"><option value="21"><option value="22"><option value="23">
</datalist>
<datalist id="minutes15">
<option value="00"><option value="15"><option value="30"><option value="45">
</datalist>

<div class="form-group">
<label>Opombe</label>
<textarea id="notes" placeholder="Podrobnosti dela..."></textarea>
</div>

<button type="submit" id="submitBtn" class="btn-submit">Zapiši Delovni Čas</button>
<button type="button" id="cancelEditBtn" class="btn-cancel-edit" style="display: none;" onclick="cancelEditing()">Prekliči urejanje</button>
</form>
</div>

<div class="accordion-container" id="settingsAccordion">
<div class="accordion-header" onclick="toggleAccordion()">
<span>⚙️ Nastavitve in upravljanje strank</span>
<span class="accordion-icon">▶</span>
</div>

<div class="accordion-content">
<div class="card" style="margin-bottom: 0; margin-top: 10px;">
<h3>📁 Baza Strank</h3>
<div class="form-row" style="margin-bottom: 0;">
<div class="form-group" style="margin-bottom: 0; flex: 2;">
<input type="text" id="newClientInput" placeholder="Ime nove stranke / podjetja">
</div>
<button type="button" class="btn-secondary" onclick="addNewClient()">Dodaj</button>
</div>

<div class="client-list-manage" id="managedClientList"></div>
</div>
</div>
</div>
</div>

<div class="right-column">
<div class="filter-container">
<div class="form-group">
<label>Filter po stranki</label>
<select id="clientFilter">
<option value="ALL">-- Vse stranke skupaj --</option>
</select>
</div>
<div class="form-group">
<label>Filter po mesecu</label>
<select id="monthFilter">
<option value="ALL">-- Vsi meseci --</option>
</select>
</div>
</div>

<div class="total-display">
<h2>Zgodovina vnosov</h2>
<div class="total-display-buttons-row">
<button type="button" class="btn-export" onclick="exportToExcel()">Izvozi v Excel (CSV)</button>
<div id="totalHours" class="total-badge">0.00 ur</div>
</div>
</div>

<div id="taskList"></div>
</div>

</div>

<script>
document.getElementById('taskDate').value = new Date().toISOString().split('T')[0];

const timeForm = document.getElementById('timeForm');
const taskListElement = document.getElementById('taskList');
const totalHoursElement = document.getElementById('totalHours');
const clientFilter = document.getElementById('clientFilter');
const monthFilter = document.getElementById('monthFilter');
const clientNameInput = document.getElementById('clientNameInput');
const clientDatalist = document.getElementById('clientDatalist');
const managedClientList = document.getElementById('managedClientList');
const newClientInput = document.getElementById('newClientInput');
const accordionContainer = document.getElementById('settingsAccordion');

const submitBtn = document.getElementById('submitBtn');
const cancelEditBtn = document.getElementById('cancelEditBtn');

let tasks = JSON.parse(localStorage.getItem('project_tasks')) || [];
let clientDatabase = JSON.parse(localStorage.getItem('client_database')) || [];
let currentClientFilter = 'ALL';
let currentMonthFilter = 'ALL';

// Indeks vnosa, ki ga urejamo
let editTargetIndex = -1;

const monthNamesSlo = [
"Januar", "Februar", "Marec", "April", "Maj", "Junij",
"Julij", "Avgust", "September", "Oktober", "November", "December"
];

// POPRAVLJENO: Nastavljanje trenutnega časa v čistem 24h zapisu
function setCurrentTimeCustom(hId, mId) {
const now = new Date();
const hours = String(now.getHours()).padStart(2, '0');
const minutes = String(now.getMinutes()).padStart(2, '0');
document.getElementById(hId).value = hours;
document.getElementById(mId).value = minutes;
}

// POPRAVLJENO: Pametni preverjevalniki, ki samodejno popravljajo vnose v 24h format
function setupSmartPickers(hId, mId) {
const hInput = document.getElementById(hId);
const mInput = document.getElementById(mId);

hInput.addEventListener('blur', () => { if(hInput.value) hInput.value = String(Math.min(23, Math.max(0, parseInt(hInput.value, 10)))).padStart(2, '0'); });
mInput.addEventListener('blur', () => { if(mInput.value) mInput.value = String(Math.min(59, Math.max(0, parseInt(mInput.value, 10)))).padStart(2, '0'); });

hInput.addEventListener('keydown', (e) => {
if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
e.preventDefault();
let current = parseInt(hInput.value, 10) || 0;
current = (e.key === 'ArrowUp') ? current + 1 : current - 1;
if (current > 23) current = 0;
if (current < 0) current = 23;
hInput.value = String(current).padStart(2, '0');
}
});

mInput.addEventListener('keydown', (e) => {
if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
e.preventDefault();
let current = parseInt(mInput.value, 10) || 0;
let remainder = current % 15;
if (e.key === 'ArrowUp') {
current = current + (15 - remainder);
} else {
current = remainder === 0 ? current - 15 : current - remainder;
}
if (current >= 60) current = 0;
if (current < 0) current = 45;
mInput.value = String(current).padStart(2, '0');
}
});
}

setupSmartPickers('startHour', 'startMin');
setupSmartPickers('endHour', 'endMin');

function toggleAccordion() {
accordionContainer.classList.toggle('active');
}

function toggleTheme() {
const body = document.body;
const currentTheme = body.getAttribute('data-theme');
const newTheme = currentTheme === 'light' ? 'dark' : 'light';
body.setAttribute('data-theme', newTheme);
localStorage.setItem('theme_pref', newTheme);
}
const savedTheme = localStorage.getItem('theme_pref') || 'light';
document.body.setAttribute('data-theme', savedTheme);

function addNewClient() {
const clientName = newClientInput.value.trim();
if (!clientName) return;
if (clientDatabase.includes(clientName)) {
alert('Ta stranka je že v bazi.');
return;
}
clientDatabase.push(clientName);
clientDatabase.sort();
localStorage.setItem('client_database', JSON.stringify(clientDatabase));
newClientInput.value = '';
updateFiltersAndLists();
render();
}

window.removeClientFromDb = function(clientName) {
if (confirm(`Ali res želiš izbrisati stranko "${clientName}" iz baze? (Vpisi ur ostanejo nedotaknjeni)`)) {
clientDatabase = clientDatabase.filter(c => c !== clientName);
localStorage.setItem('client_database', JSON.stringify(clientDatabase));
updateFiltersAndLists();
render();
}
}

function calculateDuration(start, end) {
const [sH, sM] = start.split(':').map(Number);
const [eH, eM] = end.split(':').map(Number);
let sTotal = sH * 60 + sM;
let eTotal = eH * 60 + eM;
if (eTotal < sTotal) eTotal += 24 * 60;
return (eTotal - sTotal) / 60;
}

function formatDateSlo(dateStr) {
if(!dateStr) return '';
const parts = dateStr.split('-');
if(parts.length !== 3) return dateStr;
const [y, m, d] = parts;
return `${parseInt(d, 10)}. ${parseInt(m, 10)}. ${y}`;
}

function getAvailableMonths(filteredTasks) {
const months = filteredTasks.map(t => {
if(!t.taskDate) return null;
const parts = t.taskDate.split('-');
return parts.length >= 2 ? `${parts[0]}-${parts[1]}` : null;
}).filter(Boolean);
return [...new Set(months)].sort().reverse();
}

function updateFiltersAndLists() {
const activeTaskClients = tasks.map(t => t.clientName);
const allUniqueClients = [...new Set([...clientDatabase, ...activeTaskClients])].filter(Boolean).sort();

clientDatalist.innerHTML = '';
clientDatabase.forEach(c => {
const opt = document.createElement('option');
opt.value = c;
clientDatalist.appendChild(opt);
});

const prevSelectedFilterClient = clientFilter.value;
clientFilter.innerHTML = '<option value="ALL">-- Vse stranke skupaj --</option>';

allUniqueClients.forEach(c => {
const opt = document.createElement('option');
opt.value = c;
opt.innerText = c;
clientFilter.appendChild(opt);
});

if (allUniqueClients.includes(prevSelectedFilterClient)) {
clientFilter.value = prevSelectedFilterClient;
currentClientFilter = prevSelectedFilterClient;
} else {
clientFilter.value = 'ALL';
currentClientFilter = 'ALL';
}

const tasksForMonths = tasks.filter(t => currentClientFilter === 'ALL' || t.clientName === currentClientFilter);
const availableMonths = getAvailableMonths(tasksForMonths);

const prevSelectedMonth = monthFilter.value;
monthFilter.innerHTML = '<option value="ALL">-- Vsi meseci --</option>';

availableMonths.forEach(mKey => {
const parts = mKey.split('-');
if(parts.length === 2) {
const [year, monthNum] = parts;
const monthName = monthNamesSlo[parseInt(monthNum, 10) - 1];
const opt = document.createElement('option');
opt.value = mKey;
opt.innerText = `${monthName} ${year}`;
monthFilter.appendChild(opt);
}
});

if (availableMonths.includes(prevSelectedMonth)) {
monthFilter.value = prevSelectedMonth;
currentMonthFilter = prevSelectedMonth;
} else {
monthFilter.value = 'ALL';
currentMonthFilter = 'ALL';
}

managedClientList.innerHTML = '';
if (clientDatabase.length === 0) {
managedClientList.innerHTML = '<p style="text-align:center; font-size:14px; opacity:0.5; margin: 10px 0;">Baza strank je prazna.</p>';
} else {
clientDatabase.forEach(c => {
const div = document.createElement('div');
div.className = 'client-manage-item';
div.innerHTML = `<span>${escape(c)}</span><button onclick="removeClientFromDb('${c.replace(/'/g, "\\'")}')">Odstrani</button>`;
managedClientList.appendChild(div);
});
}
}

function getFilteredTasks() {
return tasks.filter(t => {
const matchClient = (currentClientFilter === 'ALL' || t.clientName === currentClientFilter);
let matchMonth = true;
if (currentMonthFilter !== 'ALL' && t.taskDate) {
const parts = t.taskDate.split('-');
if(parts.length >= 2) {
matchMonth = (`${parts[0]}-${parts[1]}` === currentMonthFilter);
}
}
return matchClient && matchMonth;
}).sort((a, b) => new Date(b.taskDate) - new Date(a.taskDate));
}

function render() {
taskListElement.innerHTML = '';
let total = 0;

const filtered = getFilteredTasks();

if (filtered.length === 0) {
taskListElement.innerHTML = '<p style="text-align:center; opacity:0.5; margin: 20px 0;">Ni vnosov za izbrane filtre.</p>';
totalHoursElement.innerText = '0.00 ur';
return;
}

filtered.forEach(t => {
const dur = calculateDuration(t.startTime, t.endTime);
total += dur;

const originalIndex = tasks.indexOf(t);
const isEditingThis = (originalIndex === editTargetIndex);

const item = document.createElement('div');
item.className = `task-item ${isEditingThis ? 'editing-now' : ''}`;

// Varno preverjanje, če so polja prazna
let displayClient = t.clientName || 'Neznana stranka';
let displayProject = t.projectName || 'Splošno delo';

/* POPRAVLJENO: Nova flex postavitev, kjer so gumbi (task-actions) zapakirani skupaj s trajanjem v 'task-right-side' */
item.innerHTML = `
                   <div class="task-client">${escape(displayClient)}</div>
                   <div class="task-main-info">
                       <div class="task-project">${escape(displayProject)}</div>
                       <div class="task-right-side">
                           <div class="task-duration">${dur.toFixed(2)} ur</div>
                           <div class="task-actions">
                               <button class="action-btn edit-btn" onclick="startEditing(${originalIndex})">✏️ Uredi</button>
                               <button class="action-btn delete-btn" onclick="deleteTask(${originalIndex})">Briši</button>
                           </div>
                       </div>
                   </div>
                   ${t.locationName ? `<div class="task-location">📍 ${escape(t.locationName)}</div>` : ''}
                   
                   <div class="task-meta">
                       <span>🗓️ ${formatDateSlo(t.taskDate)}</span>
                       <span>•</span>
                       <span>⏰ ${t.startTime} - ${t.endTime}</span>
                   </div>
                   
                   ${t.notes ? `<div class="task-notes">${escape(t.notes)}</div>` : ''}
               `;
taskListElement.appendChild(item);
});
        
totalHoursElement.innerText = `${total.toFixed(2)} ur`;
}

function escape(s) {
let d = document.createElement('div');
d.innerText = s;
return d.innerHTML;
}

// FUNKCIJA ZA PRIČETEK UREJANJA VNOSA
window.startEditing = function(index) {
editTargetIndex = index;
const targetTask = tasks[index];

// Prenos podatkov v obrazec
clientNameInput.value = targetTask.clientName;
document.getElementById('locationName').value = targetTask.locationName || '';
document.getElementById('projectName').value = targetTask.projectName;
document.getElementById('taskDate').value = targetTask.taskDate;

// Razcep ure za 24h pickerje
if(targetTask.startTime && targetTask.startTime.includes(':')) {
const [sh, sm] = targetTask.startTime.split(':');
document.getElementById('startHour').value = sh;
document.getElementById('startMin').value = sm;
}
if(targetTask.endTime && targetTask.endTime.includes(':')) {
const [eh, em] = targetTask.endTime.split(':');
document.getElementById('endHour').value = eh;
document.getElementById('endMin').value = em;
}

document.getElementById('notes').value = targetTask.notes || '';

// Sprememba gumbov v obrazcu
submitBtn.innerText = "Posodobi Delovni Čas";
submitBtn.classList.add('mode-edit');
cancelEditBtn.style.display = "block";

render();

document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
clientNameInput.focus();
};

// FUNKCIJA ZA PREKLIC UREJANJA
window.cancelEditing = function() {
editTargetIndex = -1;
timeForm.reset();
document.getElementById('taskDate').value = new Date().toISOString().split('T')[0];

submitBtn.innerText = "Zapiši Delovni Čas";
submitBtn.classList.remove('mode-edit');
cancelEditBtn.style.display = "none";

render();
};

function exportToExcel() {
const filteredTasks = getFilteredTasks();
if (filteredTasks.length === 0) {
alert('Ni podatkov za izvoz.');
return;
}

const headers = ['Stranka', 'Lokacija', 'Projekt', 'Datum', 'Zacetek', 'Konec', 'Trajanje (ure)', 'Opombe'];

const rows = filteredTasks.map(t => {
const duration = calculateDuration(t.startTime, t.endTime).toFixed(2);
return [
`"${(t.clientName || '').replace(/"/g, '""')}"`,
`"${(t.locationName || '').replace(/"/g, '""')}"`,
`"${(t.projectName || '').replace(/"/g, '""')}"`,
`"${formatDateSlo(t.taskDate)}"`,
`"${t.startTime || ''}"`,
`"${t.endTime || ''}"`,
`"${duration.replace('.', ',')}"`, 
`"${(t.notes || '').replace(/"/g, '""').replace(/\r?\n/g, ' ')}"`
].join(';');
});

const csvContent = headers.join(';') + '\r\n' + rows.join('\r\n');
const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });

let filename = 'Sledilnik_Casa_izvoz';
if (currentClientFilter !== 'ALL') filename += `_${currentClientFilter.replace(/[^a-zA-Z0-9]/g, '_')}`;
if (currentMonthFilter !== 'ALL') filename += `_${currentMonthFilter}`;
filename += '.csv';

if (navigator.msSaveBlob) { 
navigator.msSaveBlob(blob, filename);
} else {
const link = document.createElement('a');
if (link.download !== undefined) {
const url = URL.createObjectURL(blob);
link.setAttribute('href', url);
link.setAttribute('download', filename);
link.style.visibility = 'hidden';
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
}
}
}

timeForm.addEventListener('submit', (e) => {
e.preventDefault();
const inputClientRaw = clientNameInput.value.trim();

if (!inputClientRaw) {
alert('Prosimo, vnesite ali izberite stranko.');
return;
}

if (!clientDatabase.includes(inputClientRaw)) {
clientDatabase.push(inputClientRaw);
clientDatabase.sort();
localStorage.setItem('client_database', JSON.stringify(clientDatabase));
}

// Sestavljanje časa iz 24h vnosov
const sH = document.getElementById('startHour').value.padStart(2, '0');
const sM = document.getElementById('startMin').value.padStart(2, '0');
const eH = document.getElementById('endHour').value.padStart(2, '0');
const eM = document.getElementById('endMin').value.padStart(2, '0');

const startTime = `${sH}:${sM}`;
const endTime = `${eH}:${eM}`;

const taskData = {
clientName: inputClientRaw,
locationName: document.getElementById('locationName').value.trim(),
projectName: document.getElementById('projectName').value.trim(),
taskDate: document.getElementById('taskDate').value,
startTime: startTime,
endTime: endTime,
notes: document.getElementById('notes').value.trim()
};

if (editTargetIndex > -1) {
tasks[editTargetIndex] = taskData;
editTargetIndex = -1;
submitBtn.innerText = "Zapiši Delovni Čas";
submitBtn.classList.remove('mode-edit');
cancelEditBtn.style.display = "none";
} else {
tasks.push(taskData);
}

localStorage.setItem('project_tasks', JSON.stringify(tasks));

timeForm.reset();
document.getElementById('taskDate').value = new Date().toISOString().split('T')[0];

updateFiltersAndLists();
render();
});

clientFilter.addEventListener('change', (e) => {
currentClientFilter = e.target.value;
updateFiltersAndLists();
monthFilter.value = 'ALL';
currentMonthFilter = 'ALL';
render();
});

monthFilter.addEventListener('change', (e) => {
currentMonthFilter = e.target.value;
render();
});

window.deleteTask = function(i) {
if (i === editTargetIndex) {
cancelEditing();
}
if (confirm('Izbrišem ta vnos časa?')) {
tasks.splice(i, 1);
localStorage.setItem('project_tasks', JSON.stringify(tasks));
updateFiltersAndLists();
render();
}
};

updateFiltersAndLists();
render();
</script>
</body>
